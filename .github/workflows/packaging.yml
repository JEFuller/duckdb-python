name: Packaging
run-name: Build ${{ inputs.minimal && 'minimal set of' || 'all' }} packages (version=${{ inputs.set-version != '' && inputs.set-version || 'dev' }}, tests=${{ inputs.testsuite }}, ref=${{ inputs.duckdb-python-sha }}, duckdb ref=${{ inputs.duckdb-sha }})
on:
  workflow_dispatch:
    inputs:
      minimal:
        type: boolean
        description: Build a minimal set of wheels to do a sanity check
        default: false
      testsuite:
        type: choice
        description: Testsuite to run (none, fast, all)
        required: true
        default: all
        options:
          - none
          - fast
          - all
      duckdb-python-sha:
        type: string
        description: The commit to build against (defaults to latest commit of current ref)
        required: false
      duckdb-sha:
        type: string
        description: Override the DuckDB submodule commit or ref to build against
        required: false
      set-version:
        type: string
        description: Force version (vX.Y.Z, optionally -postN or a PEP440 pre-release suffix like -a1/-alpha1/-b2/-rc3)
        required: false
  workflow_call:
    inputs:
      minimal:
        type: boolean
        description: Build a minimal set of wheels to do a sanity check
        default: false
      testsuite:
        type: string
        description: Testsuite to run (none, fast, all)
        required: true
        default: all
      duckdb-python-sha:
        type: string
        description: The commit or ref to build against (defaults to latest commit of current ref)
        required: false
      duckdb-sha:
        type: string
        description: Override the DuckDB submodule commit or ref to build against
        required: false
      set-version:
        description: Force version (vX.Y.Z, optionally -postN or a PEP440 pre-release suffix like -a1/-alpha1/-b2/-rc3)
        required: false
        type: string

concurrency:
  group: packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build_sdist:
    if: ${{ github.ref_name != 'v1.5.6-zoneinfo' }}
    name: Build an sdist and determine versions
    uses: ./.github/workflows/packaging_sdist.yml
    with:
      testsuite: ${{ inputs.testsuite }}
      duckdb-python-sha: ${{ inputs.duckdb-python-sha != '' && inputs.duckdb-python-sha || github.sha }}
      duckdb-sha: ${{ inputs.duckdb-sha }}
      set-version: ${{ inputs.set-version }}

  build_wheels:
    if: ${{ github.ref_name != 'v1.5.6-zoneinfo' }}
    name: Build and test releases
    uses: ./.github/workflows/packaging_wheels.yml
    with:
      minimal: ${{ inputs.minimal }}
      testsuite: ${{ inputs.testsuite }}
      duckdb-python-sha: ${{ inputs.duckdb-python-sha != '' && inputs.duckdb-python-sha || github.sha }}
      duckdb-sha: ${{ inputs.duckdb-sha }}
      set-version: ${{ inputs.set-version }}

  zoneinfo_wheels:
    name: Zoneinfo CPython 3.12.13 ${{ matrix.platform }}
    if: ${{ github.repository == 'JEFuller/duckdb-python' && github.ref_name == 'v1.5.6-zoneinfo' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            python: .consumer/Scripts/python.exe
          - platform: linux-x86_64
            os: ubuntu-24.04
            python: .consumer/bin/python
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            python: .consumer/bin/python
          - platform: macos-arm64
            os: macos-15
            python: .consumer/bin/python
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      OVERRIDE_GIT_DESCRIBE: v1.5.6+zoneinfo
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CMAKE_GENERATOR: Ninja
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12.13"
          enable-cache: false
      - name: Build wheel without publishing
        run: |
          uv run --no-project --python 3.12.13 python -c 'import sys; assert sys.version_info[:3] == (3, 12, 13), sys.version'
          uv build --wheel --python 3.12.13 --out-dir wheelhouse
      - name: Install wheel in a separate environment
        run: |
          uv venv --python 3.12.13 .consumer
          uv pip install --python ${{ matrix.python }} --no-index --find-links wheelhouse 'duckdb==1.5.6+zoneinfo'
          ${{ matrix.python }} -c 'import sys; from importlib.metadata import version; import duckdb; assert sys.version_info[:3] == (3, 12, 13), sys.version; assert version("duckdb") == "1.5.6+zoneinfo"; assert duckdb.sql("SELECT version()").fetchone() == ("v1.5.6",)'
      - name: Test installed wheel
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv pip install --python ${{ matrix.python }} pytest pytest-timeout pytest-reraise pytest-timestamper packaging numpy pandas==3.0.3 pyarrow==24.0.0 tzdata
          ${{ matrix.python }} -m pytest tests/fast/api/test_native_tz.py tests/fast/arrow/test_timestamp_timezone.py tests/fast/arrow/test_arrow_offsets.py tests/fast/test_all_types.py tests/fast/pandas/test_append_df.py tests/fast/test_optional_dependencies.py tests/fast/test_versioning.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-cp312-${{ matrix.platform }}-zoneinfo
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0
